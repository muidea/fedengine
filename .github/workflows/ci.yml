name: Rust validation
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: fedengine
      - uses: actions/checkout@v4
        with:
          repository: muidea/modorch-rs
          ref: ccc77ce9501cd3e942677bba51b6ff3efb1c63f6
          path: modorch-rs
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: rustfmt, clippy
      - name: Check framework identity
        working-directory: fedengine
        run: python3 .agents/skills/modorch-app-development/scripts/preflight.py --manifest-path Cargo.toml
      - name: Validate
        working-directory: fedengine
        run: |
          cargo fmt --all -- --check
          cargo check --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
          cargo doc --workspace --no-deps --locked
          cargo build --locked
          python3 scripts/smoke.py
      - name: Disposable federation integration
        working-directory: fedengine
        run: scripts/test-federation.sh
